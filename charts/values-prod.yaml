# PROD Environment Overrides
replicaCount: 3

image:
  repository: devops-app
  tag: "v2.0.0"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

rollout:
  enabled: true
